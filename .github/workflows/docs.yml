name: Docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      # E2E-09 runs the examples against the real API
      - uses: actions/checkout@v4
        with:
          repository: shuoshuotw/shuoshuo-core
          path: .core
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: .core

      - name: The contract snapshot matches Core
        run: |
          diff openapi/openapi.yaml .core/openapi/openapi.yaml
          diff openapi/errors.yaml .core/openapi/errors.yaml

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check:links

      - run: pnpm exec supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,mailpit
        working-directory: .core
      - name: Write Core's .env.local
        working-directory: .core
        run: |
          secret=$(pnpm exec supabase status -o env | grep -E '^SECRET_KEY=' | cut -d= -f2- | tr -d '"')
          sed -e "s|^SUPABASE_SECRET_KEY=.*|SUPABASE_SECRET_KEY=$secret|" \
              -e "s|^INTERNAL_HMAC_SECRETS=.*|INTERNAL_HMAC_SECRETS=$(openssl rand -hex 32)|" \
              -e "/^SENTRY_DSN=/d" .env.example > .env.local
          echo "SUPABASE_SECRET_KEY=$secret" >> "$GITHUB_ENV"
      - run: pnpm build
        working-directory: .core
      - name: Start Core
        working-directory: .core
        run: |
          pnpm start > core.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3001/v1/health && exit 0; sleep 1; done
          cat core.log
          exit 1

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

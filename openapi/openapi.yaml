# Source of truth for the API contract (SPEC §8.12). Hand-maintained.
openapi: 3.1.0
info:
  title: 說說 API
  version: 1.0.0
  description: 繁體中文短句平台的公開 API。版本政策見文件；`/v1` 內只做非破壞性變更。呼叫方必須能處理未知的錯誤碼與類別 key。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: 說說
    url: https://docs.shuoshuotw.xyz
servers:
  - url: https://api.shuoshuotw.xyz
    description: Production
tags:
  - name: 說說
    description: 說說
  - name: 按讚與收藏
    description: 按讚與收藏
  - name: 留言
    description: 留言
  - name: 檢舉
    description: 檢舉
  - name: 個人
    description: 個人
  - name: API Key
    description: API Key
  - name: 管理
    description: 管理
  - name: 系統
    description: 系統
  - name: 公開使用者
    description: 公開使用者
security: []
paths:
  /v1/quotes/random:
    get:
      operationId: getRandomQuote
      tags:
        - 說說
      summary: 取得隨機說說
      description: |-
        公開，可帶 API Key 或 JWT 提升額度。`format=text` 時 body 僅有說說本文、結尾無換行，說說 ID 放於 `X-Quote-Id`。

        **驗證：** 公開；可帶 API Key 或 JWT 提升額度。
      security:
        - {}
        - bearerAuth: []
      x-auth: public
      x-rate-limit: RL-PUBLIC
      x-cache: C-NONE
      x-errors:
        - CREDENTIAL_IN_QUERY
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - API_KEY_INVALID
        - API_KEY_REVOKED
        - INTERNAL_AUTH_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - VALIDATION_FAILED
        - INVALID_JSON
        - INVALID_CURSOR
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CATEGORY_FILTER_CONFLICT
        - INVALID_LENGTH_RANGE
        - NO_QUOTE_MATCHED
      x-codeSamples:
        - lang: curl
          label: curl
          source: curl "https://api.shuoshuotw.xyz/v1/quotes/random?categories=anime,game&max_length=40"
        - lang: javascript
          label: JavaScript
          source: |-
            const response = await fetch("https://api.shuoshuotw.xyz/v1/quotes/random?categories=anime,game&max_length=40");
            console.log(await response.json());
        - lang: python
          label: Python
          source: |-
            import requests

            response = requests.get("https://api.shuoshuotw.xyz/v1/quotes/random?categories=anime,game&max_length=40")
            print(response.json())
      parameters:
        - name: categories
          in: query
          required: false
          schema:
            type: string
          description: 逗號分隔的類別 key；未知 key 回 400
        - name: exclude_categories
          in: query
          required: false
          schema:
            type: string
          description: 同 categories；不可與 categories 併用
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - text
            default: json
          description: 回應格式
        - name: min_length
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: 最小長度（含）
        - name: max_length
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: 最大長度（含）；須 ≥ min_length
      responses:
        "200":
          description: 成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            X-Quote-Id:
              schema:
                type: string
                format: uuid
              description: format=text 時的說說 ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/Quote"
                  meta:
                    $ref: "#/components/schemas/Meta"
            text/plain:
              schema:
                type: string
                description: 僅有說說本文，結尾無換行
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /v1/quotes:
    get:
      operationId: listQuotes
      tags:
        - 說說
      summary: 說說列表
      description: |-
        只回傳 `published`，依 `created_at` 新到舊。

        **驗證：** 公開；可帶 API Key 或 JWT 提升額度。
      security:
        - {}
        - bearerAuth: []
      x-auth: public
      x-rate-limit: RL-PUBLIC
      x-cache: C-30
      x-errors:
        - CREDENTIAL_IN_QUERY
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - API_KEY_INVALID
        - API_KEY_REVOKED
        - INTERNAL_AUTH_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - VALIDATION_FAILED
        - INVALID_JSON
        - INVALID_CURSOR
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
      x-codeSamples:
        - lang: curl
          label: curl
          source: curl "https://api.shuoshuotw.xyz/v1/quotes?categories=poetry&limit=2"
        - lang: javascript
          label: JavaScript
          source: |-
            const response = await fetch("https://api.shuoshuotw.xyz/v1/quotes?categories=poetry&limit=2");
            console.log(await response.json());
        - lang: python
          label: Python
          source: |-
            import requests

            response = requests.get("https://api.shuoshuotw.xyz/v1/quotes?categories=poetry&limit=2")
            print(response.json())
      parameters:
        - name: categories
          in: query
          required: false
          schema:
            type: string
          description: 逗號分隔的類別 key；未知 key 回 400
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: 上一頁的 next_cursor，內容不透明
      responses:
        "200":
          description: 成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, s-maxage=30, stale-while-revalidate=60
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Quote"
                  meta:
                    $ref: "#/components/schemas/ListMeta"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
    post:
      operationId: createQuote
      tags:
        - 說說
      summary: 提交說說
      description: |-
        `content_hash = SHA-256(NFKC + 轉小寫 + 移除空白與標點後的內容)`，全形半形或標點差異視為重複。

        **驗證：** 使用者 JWT 或 API Key（API Key 需 `quotes:write`）。
      security:
        - bearerAuth: []
      x-auth: jwt_or_key
      x-required-scope: quotes:write
      x-rate-limit: RL-WRITE
      x-cache: C-NONE
      x-errors:
        - CREDENTIAL_IN_QUERY
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - API_KEY_INVALID
        - API_KEY_REVOKED
        - INTERNAL_AUTH_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - VALIDATION_FAILED
        - INVALID_JSON
        - INVALID_CURSOR
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - AUTHENTICATION_REQUIRED
        - INSUFFICIENT_SCOPE
        - API_KEY_NOT_ALLOWED
        - ACCOUNT_BANNED
        - SUBMISSION_SUSPENDED
        - QUOTE_DUPLICATE
        - QUOTE_NOT_TRADITIONAL
        - QUOTE_NO_HAN
      x-codeSamples:
        - lang: curl
          label: curl
          source: "curl -X POST -H \"Authorization: Bearer $SHUOSHUO_TOKEN\" -H \"Content-Type: application/json\" -d '{\"content\":\"我們都是陰溝裡的蟲，但總還是得有人仰望星空。\",\"category\":\"literature\",\"source_from\":\"王爾德《溫夫人的扇子》\"}' \"https://api.shuoshuotw.xyz/v1/quotes\""
        - lang: javascript
          label: JavaScript
          source: |-
            const response = await fetch("https://api.shuoshuotw.xyz/v1/quotes", { method: "POST", headers: { Authorization: `Bearer ${process.env.SHUOSHUO_TOKEN}`, "Content-Type": "application/json" }, body: JSON.stringify({"content":"我們都是陰溝裡的蟲，但總還是得有人仰望星空。","category":"literature","source_from":"王爾德《溫夫人的扇子》"}) });
            console.log(await response.json());
        - lang: python
          label: Python
          source: |-
            import os
            import requests

            response = requests.post("https://api.shuoshuotw.xyz/v1/quotes", headers={"Authorization": f"Bearer {os.environ['SHUOSHUO_TOKEN']}"}, json={"content":"我們都是陰溝裡的蟲，但總還是得有人仰望星空。","category":"literature","source_from":"王爾德《溫夫人的扇子》"})
            print(response.json())
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
                - category
                - source_from
              additionalProperties: false
              properties:
                content:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: 先 trim 與 NFC 正規化；2 至 100 code point（D-19）；含至少 1 個漢字；不可含控制字元（換行除外）與零寬字元（Emoji 用 ZWJ 除外）；不含簡體專用字
                category:
                  type: string
                  description: 類別 key
                source_from:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: 這則說說來自哪裡
            example:
              content: 我們都是陰溝裡的蟲，但總還是得有人仰望星空。
              category: literature
              source_from: 王爾德《溫夫人的扇子》
      responses:
        "201":
          description: 成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Location:
              schema:
                type: string
              description: 新資源的路徑
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/Quote"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /v1/quotes/trending:
    get:
      operationId: listTrendingQuotes
      tags:
        - 說說
      summary: 近期熱門
      description: |-
        `分數 = 近 7 天按讚數 + 5 × 新鮮度`（D-37），同分時新者優先。排名會隨時間變動，所以不分頁。

        **驗證：** 公開；可帶 API Key 或 JWT 提升額度。
      security:
        - {}
        - bearerAuth: []
      x-auth: public
      x-rate-limit: RL-PUBLIC
      x-cache: C-30
      x-errors:
        - CREDENTIAL_IN_QUERY
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - API_KEY_INVALID
        - API_KEY_REVOKED
        - INTERNAL_AUTH_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - VALIDATION_FAILED
        - INVALID_JSON
        - INVALID_CURSOR
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
      x-codeSamples:
        - lang: curl
          label: curl
          source: curl "https://api.shuoshuotw.xyz/v1/quotes/trending?limit=10"
        - lang: javascript
          label: JavaScript
          source: |-
            const response = await fetch("https://api.shuoshuotw.xyz/v1/quotes/trending?limit=10");
            console.log(await response.json());
        - lang: python
          label: Python
          source: |-
            import requests

            response = requests.get("https://api.shuoshuotw.xyz/v1/quotes/trending?limit=10")
            print(response.json())
      parameters:
        - name: categories
          in: query
          required: false
          schema:
            type: string
          description: 逗號分隔的類別 key；未知 key 回 400
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, s-maxage=30, stale-while-revalidate=60
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Quote"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /v1/quotes/{id}:
    get:
      operationId: getQuote
      tags:
        - 說說
      summary: 取得單一說說
      description: |-
        `status` 可能是 `under_review`。回應不含「我是否已按讚」以維持可快取，前端另行呼叫 `GET /v1/me/quote-states`。

        **驗證：** 公開；可帶 API Key 或 JWT 提升額度。
      security:
        - {}
        - bearerAuth: []
      x-auth: public
      x-rate-limit: RL-PUBLIC
      x-cache: C-30
      x-errors:
        - CREDENTIAL_IN_QUERY
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - API_KEY_INVALID
        - API_KEY_REVOKED
        - INTERNAL_AUTH_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - VALIDATION_FAILED
        - INVALID_JSON
        - INVALID_CURSOR
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - QUOTE_NOT_FOUND
        - QUOTE_REMOVED
      x-codeSamples:
        - lang: curl
          label: curl
          source: curl "https://api.shuoshuotw.xyz/v1/quotes/0f8fad5b-d9cb-469f-a165-70867728950e"
        - lang: javascript
          label: JavaScript
          source: |-
            const response = await fetch("https://api.shuoshuotw.xyz/v1/quotes/0f8fad5b-d9cb-469f-a165-70867728950e");
            console.log(await response.json());
        - lang: python
          label: Python
          source: |-
            import requests

            response = requests.get("https://api.shuoshuotw.xyz/v1/quotes/0f8fad5b-d9cb-469f-a165-70867728950e")
            print(response.json())
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 非 UUID 時回傳該資源的 404
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - text
            default: json
          description: 回應格式
      responses:
        "200":
          description: 成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, s-maxage=30, stale-while-revalidate=60
            X-Quote-Id:
              schema:
                type: string
                format: uuid
              description: format=text 時的說說 ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/Quote"
                  meta:
                    $ref: "#/components/schemas/Meta"
            text/plain:
              schema:
                type: string
                description: 僅有說說本文，結尾無換行
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "410":
          $ref: "#/components/responses/Error410"
        "413":
          $ref: "#/components/responses/Error413"
        "415":
          $ref: "#/components/responses/Error415"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
    patch:
      operationId: updateQuote
      tags:
        - 說說
      summary: 編輯自己的說說
      description: |-
        發布後 24 小時內可編輯，以資料庫時間判定；按讚與留言都保留（D-32）。Body 至少要有一個欄位。內容與發布時相比變更 ≥ 50% 時拒絕。

        **驗證：** 使用者 JWT 或 API Key（API Key 需 `quotes:write`）。
      security:
        - bearerAuth: []
      x-auth: jwt_or_key
      x-required-scope: quotes:write
      x-rate-limit: RL-WRITE
      x-cache: C-NONE
      x-errors:
        - CREDENTIAL_IN_QUERY
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - API_KEY_INVALID
        - API_KEY_REVOKED
        - INTERNAL_AUTH_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - VALIDATION_FAILED
        - INVALID_JSON
        - INVALID_CURSOR
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - AUTHENTICATION_REQUIRED
        - INSUFFICIENT_SCOPE
        - API_KEY_NOT_ALLOWED
        - ACCOUNT_BANNED
        - QUOTE_NOT_FOUND
        - QUOTE_REMOVED
        - NOT_RESOURCE_OWNER
        - QUOTE_HAS_OPEN_CASE
        - SUBMISSION_SUSPENDED
        - QUOTE_DUPLICATE
        - QUOTE_NOT_TRADITIONAL
        - QUOTE_NO_HAN
        - QUOTE_EDIT_WINDOW_EXPIRED
        - QUOTE_EDIT_TOO_LARGE
      x-codeSamples:
        - lang: curl
          label: curl
          source: "curl -X PATCH -H \"Authorization: Bearer $SHUOSHUO_TOKEN\" -H \"Content-Type: application/json\" -d '{\"content\":\"我們都是陰溝裡的蟲，但總還是得有人仰望星空。\",\"source_from\":\"溫夫人的扇子\"}' \"https://api.shuoshuotw.xyz/v1/quotes/0f8fad5b-d9cb-469f-a165-70867728950e\""
        - lang: javascript
          label: JavaScript
          source: |-
            const response = await fetch("https://api.shuoshuotw.xyz/v1/quotes/0f8fad5b-d9cb-469f-a165-70867728950e", { method: "PATCH", headers: { Authorization: `Bearer ${process.env.SHUOSHUO_TOKEN}`, "Content-Type": "application/json" }, body: JSON.stringify({"content":"我們都是陰溝裡的蟲，但總還是得有人仰望星空。","source_from":"溫夫人的扇子"}) });
            console.log(await response.json());
        - lang: python
          label: Python
          source: |-
            import os
            import requests

            response = requests.patch("https://api.shuoshuotw.xyz/v1/quotes/0f8fad5b-d9cb-469f-a165-70867728950e", headers={"Authorization": f"Bearer {os.environ['SHUOSHUO_TOKEN']}"}, json={"content":"我們都是陰溝裡的蟲，但總還是得有人仰望星空。","source_from":"溫夫人的扇子"})
            print(response.json())
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 非 UUID 時回傳該資源的 404
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                content:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: 先 trim 與 NFC 正規化；2 至 100 code point（D-19）；含至少 1 個漢字；不可含控制字元（換行除外）與零寬字元（Emoji 用 ZWJ 除外）；不含簡體專用字
                category:
                  type: string
                  description: 類別 key
                source_from:

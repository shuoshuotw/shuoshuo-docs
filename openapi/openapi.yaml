components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 使用者 JWT，或格式為 shuoshuo_live_<8 字元>_<43 字元> 的 API Key
    internalHmac:
      type: apiKey
      in: header
      name: X-Shuoshuo-Internal
      description: 僅供 shuoshuo-client 的 SSR；簽章涵蓋方法與完整路徑
  headers:
    XRequestId:
      description: 請求追蹤碼
      schema:
        type: string
    RateLimitLimit:
      description: 視窗額度
      schema:
        type: integer
    RateLimitRemaining:
      description: 剩餘額度
      schema:
        type: integer
    RateLimitReset:
      description: 距離重置的秒數
      schema:
        type: integer
  responses:
    Error400:
      description: 請求不合規。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error401:
      description: 未通過驗證。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error403:
      description: 權限不足。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error404:
      description: 找不到資源。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error409:
      description: 狀態衝突。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error410:
      description: 資源已移除。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error413:
      description: 內容過大。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error415:
      description: 格式不符。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error422:
      description: 內容未通過檢查。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error429:
      description: 超過速率限制。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error500:
      description: 伺服器錯誤。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error503:
      description: 服務暫不可用。各端點可能的錯誤碼列於其 x-errors，內容見 errors.yaml
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Meta:
      type: object
      required:
        - request_id
      additionalProperties: false
      properties:
        request_id:
          type: string
    ListMeta:
      type: object
      required:
        - request_id
        - pagination
      additionalProperties: false
      properties:
        request_id:
          type: string
        pagination:
          type: object
          required:
            - limit
            - next_cursor
            - has_more
          additionalProperties: false
          properties:
            limit:
              type: integer
            next_cursor:
              type:
                - string
                - "null"
            has_more:
              type: boolean
    ErrorEnvelope:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
            - code
            - status
            - message
            - message_en
            - docs_url
            - request_id
          additionalProperties: false
          properties:
            code:
              type: string
              description: 錯誤碼，見 errors.yaml。呼叫方必須能處理未知的 code
            status:
              type: integer
            message:
              type: string
            message_en:
              type: string
            details:
              type: object
              additionalProperties: true
            docs_url:
              type: string
              format: uri
            request_id:
              type: string
    ReportReason:
      type: string
      enum:
        - harassment
        - hate
        - sexual
        - violence
        - privacy
        - spam
        - misinformation
        - simplified_chinese
        - other
    ApiKeyScope:
      type: string
      enum:
        - quotes:read
        - quotes:write
        - reactions:write
        - comments:write
        - me:read
    Quote:
      type: object
      required:
        - id
        - content
        - length
        - category
        - source_from
        - submitter
        - stats
        - status
        - commit_from
        - edited_at
        - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
          description: 說說本文。純文字，輸出時由呼叫方負責跳脫
        length:
          type: integer
          description: Unicode code point 數。Emoji 組合字會算成多個
        category:
          type: object
          required:
            - key
            - name
          additionalProperties: false
          properties:
            key:
              type: string
            name:
              type: string
              description: 中文名稱
        source_from:
          type: string
          description: 這則說說來自哪裡
        submitter:
          type: object
          required:
            - id
            - username
            - deleted
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            deleted:
              type: boolean
              description: 帳號已刪除時為 true。該名稱可能已被他人使用，須顯示「已刪除」且不連到個人頁（D-35）
        stats:
          type: object
          required:
            - like_count
            - favorite_count
            - comment_count
          additionalProperties: false
          properties:
            like_count:
              type: integer
            favorite_count:
              type: integer
            comment_count:
              type: integer
          description: 最多 60 秒的延遲
        status:
          type: string
          enum:
            - published
            - under_review
        commit_from:
          type: string
          enum:
            - web
            - api
        edited_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
    OwnQuote:
      type: object
      required:
        - id
        - content
        - length
        - category
        - source_from
        - submitter
        - stats
        - status
        - commit_from
        - edited_at
        - created_at
        - removed_reason
        - removed_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
          description: 說說本文。純文字，輸出時由呼叫方負責跳脫
        length:
          type: integer
          description: Unicode code point 數。Emoji 組合字會算成多個
        category:
          type: object
          required:
            - key
            - name
          additionalProperties: false
          properties:
            key:
              type: string
            name:
              type: string
              description: 中文名稱
        source_from:
          type: string
          description: 這則說說來自哪裡
        submitter:
          type: object
          required:
            - id
            - username
            - deleted
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            deleted:
              type: boolean
              description: 帳號已刪除時為 true。該名稱可能已被他人使用，須顯示「已刪除」且不連到個人頁（D-35）
        stats:
          type: object
          required:
            - like_count
            - favorite_count
            - comment_count
          additionalProperties: false
          properties:
            like_count:
              type: integer
            favorite_count:
              type: integer
            comment_count:
              type: integer
          description: 最多 60 秒的延遲
        status:
          type: string
          enum:
            - published
            - under_review
            - removed
        commit_from:
          type: string
          enum:
            - web
            - api
        edited_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        removed_reason:
          oneOf:
            - $ref: "#/components/schemas/ReportReason"
            - type: "null"
        removed_at:
          type:
            - string
            - "null"
          format: date-time
    Comment:
      type: object
      required:
        - id
        - quote_id
        - content
        - user
        - pinned_at
        - edited_at
        - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        content:
          type: string
        user:
          type: object
          required:
            - id
            - username
            - avatar_url
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            avatar_url:
              type:
                - string
                - "null"
        pinned_at:
          type:
            - string
            - "null"
          format: date-time
        edited_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
    PublicProfile:
      type: object
